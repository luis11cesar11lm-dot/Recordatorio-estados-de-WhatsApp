<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recordatorio · Estados de WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-fondo-1:#0B4A3A;
    --verde-fondo-2:#073327;
    --menta:#2FE1A0;
    --menta-suave:#8CF3CD;
    --crema:#FBF5E9;
    --naranja:#E4823F;
    --tinta:#0F2620;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:
      radial-gradient(60% 50% at 50% 12%, rgba(47,225,160,0.16), transparent 60%),
      linear-gradient(160deg, var(--verde-fondo-1), var(--verde-fondo-2));
    font-family:'Mulish', sans-serif;
    color:var(--crema);
    overflow-x:hidden;
  }

  .escenario{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px 60px;
    position:relative;
  }

  /* puntitos tipo tablero de corcho, sutil textura de fondo */
  .escenario::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:26px 26px;
    pointer-events:none;
  }

  .marca{
    position:relative;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.02em;
    color:var(--menta-suave);
    opacity:0.85;
    margin-bottom:26px;
  }

  /* ---- tarjeta del personaje con marco de "estado" ---- */
  .marco-estado{
    position:relative;
    width:min(66vw, 280px);
    aspect-ratio:901/1600;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:8px;
  }

  .anillo{
    position:absolute;
    inset:0;
    border-radius:32px;
    padding:6px;
    background:conic-gradient(from 0deg, var(--menta), var(--menta-suave), var(--naranja), var(--menta));
    animation:girar 6s linear infinite;
  }
  .anillo::after{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:26px;
    background:var(--verde-fondo-2);
  }

  @keyframes girar{
    to{ transform:rotate(360deg); }
  }

  .tarjeta-personaje{
    position:relative;
    width:calc(100% - 26px);
    height:calc(100% - 26px);
    border-radius:26px;
    background:var(--crema);
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    animation:flotar 3.6s ease-in-out infinite;
  }

  .tarjeta-personaje img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center bottom;
    padding:10px;
  }

  @keyframes flotar{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }

  /* insignia de "nuevo estado / subir" */
  .insignia{
    position:absolute;
    right:-8px;
    bottom:6%;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--menta);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
    animation:rebotar 2.2s ease-in-out infinite;
    border:3px solid var(--verde-fondo-2);
  }
  .insignia svg{ width:24px; height:24px; }

  @keyframes rebotar{
    0%, 100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-8px) scale(1.05); }
  }

  /* ---- cartel / letrero con el mensaje ---- */
  .letrero-cuerda{
    width:2px;
    height:26px;
    background:rgba(251,245,233,0.35);
  }

  .letrero{
    position:relative;
    margin-top:2px;
    max-width:560px;
    width:100%;
    background:var(--crema);
    color:var(--tinta);
    border-radius:22px;
    padding:34px 30px 30px;
    text-align:center;
    box-shadow:0 18px 40px rgba(0,0,0,0.4);
    transform-origin:top center;
    animation:balanceo 4.2s ease-in-out infinite;
  }

  .letrero::before{
    content:"";
    position:absolute;
    top:-9px;
    left:50%;
    transform:translateX(-50%) rotate(45deg);
    width:18px;
    height:18px;
    background:var(--crema);
    border-radius:3px;
  }

  @keyframes balanceo{
    0%, 100%{ transform:rotate(-1.2deg); }
    50%{ transform:rotate(1.2deg); }
  }

  .letrero p.etiqueta{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--naranja);
    margin:0 0 10px;
  }

  .letrero h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(24px, 5.6vw, 34px);
    line-height:1.18;
    margin:0;
    animation:respirar 3s ease-in-out infinite;
  }

  .letrero h1 .resalte{
    color:var(--naranja);
  }

  @keyframes respirar{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.025); }
  }

  .letrero p.pie{
    margin:16px 0 0;
    font-family:'Mulish', sans-serif;
    font-weight:600;
    font-size:15px;
    color:#4B5F57;
  }

  footer{
    margin-top:34px;
    font-family:'Mulish', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    color:rgba(251,245,233,0.5);
  }

  @media (max-width:420px){
    .letrero{ padding:28px 20px 24px; border-radius:18px; }
  }

  @media (prefers-reduced-motion: reduce){
    .anillo, .tarjeta-personaje, .insignia, .letrero, .letrero h1{
      animation:none !important;
    }
  }
</style>
</head>
